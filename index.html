<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bay Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    
    /* Top offset to clear Porteus banner */
    body { 
      background-color: #0b0f19; 
      color: #f1f5f9; 
      padding: 55px 20px 16px 20px; 
      overflow: hidden; 
      height: 100vh; 
    }
    
    /* Top Header */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid #1e293b; margin-bottom: 14px; }
    .brand-title { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #f8fafc; }
    .brand-title span { color: #f59e0b; }
    .header-right { display: flex; align-items: center; gap: 24px; }
    
    .sync-status { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; }
    .sync-ok { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .sync-error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; }
    .sync-ok .sync-dot { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
    .sync-error .sync-dot { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }

    .clock { font-size: 30px; font-weight: 800; color: #ffffff; letter-spacing: 1px; }

    /* Main Grid: Left 40% (Queue), Right 60% (Inventory) */
    .dashboard-grid { display: grid; grid-template-columns: 40% 60%; gap: 18px; height: calc(100vh - 130px); }
    .panel { background: #131b2e; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #243049; }
    .panel-header h2 { font-size: 19px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; color: #94a3b8; }
    .panel-header .badge { background: #1e293b; color: #f59e0b; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }

    /* Staging Queue Table */
    .table-container { overflow-y: hidden; flex-grow: 1; position: relative; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { position: sticky; top: 0; background: #131b2e; color: #64748b; font-size: 11px; text-transform: uppercase; padding: 8px 6px; border-bottom: 2px solid #243049; z-index: 2; }
    td { padding: 9px 6px; border-bottom: 1px solid #1e293b; font-size: 13px; vertical-align: middle; }
    
    /* Day Divider Rows */
    .day-divider-row td { 
      background: #0f172a !important; 
      font-weight: 900; 
      font-size: 12px; 
      letter-spacing: 1px; 
      text-transform: uppercase; 
      padding: 7px 10px;
      border-top: 1px solid #334155;
      border-bottom: 1px solid #334155;
    }
    .day-today { color: #38bdf8; }
    .day-tomorrow { color: #a855f7; }

    .time-col { font-weight: 800; color: #cbd5e1; font-size: 13px; white-space: nowrap; width: 68px; }
    .vehicle-col { font-weight: 700; color: #ffffff; font-size: 14px; line-height: 1.2; }
    .vehicle-col small { display: block; color: #94a3b8; font-size: 12px; font-weight: 500; }
    .service-badge { display: inline-block; background: #1e3a5f; color: #38bdf8; font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    
    .storage-tag { display: inline-block; background: #b45309; color: #fffbeb; font-weight: 900; font-size: 12px; padding: 3px 7px; border-radius: 5px; border: 1px solid #f59e0b; white-space: nowrap; }
    .storage-prepull { display: inline-block; background: #6b21a8; color: #f3e8ff; font-weight: 900; font-size: 12px; padding: 3px 7px; border-radius: 5px; border: 1px solid #c084fc; white-space: nowrap; }
    .storage-none { color: #475569; font-weight: 600; font-size: 11px; }
    .notes-text { color: #f59e0b; font-weight: 600; font-size: 12px; line-height: 1.2; }

    /* Inventory Grid */
    .inventory-container { overflow-y: hidden; flex-grow: 1; position: relative; }
    .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    
    .inventory-card { 
      background: #182238; 
      border: 1px solid #263554; 
      border-radius: 8px; 
      padding: 12px; 
      position: relative; 
      border-left: 6px solid #10b981; 
      display: flex; 
      gap: 12px; 
      align-items: stretch;
    }

    .card-photo {
      width: 105px;
      min-width: 105px;
      height: 105px;
      background: #0b0f19;
      border: 1px solid #243049;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content { flex-grow: 1; min-width: 0; }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .tire-size { font-size: 21px; font-weight: 900; color: #ffffff; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price-tag { font-size: 18px; font-weight: 900; color: #10b981; background: rgba(16, 185, 129, 0.12); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.35); white-space: nowrap; }
    .tire-model { font-size: 14px; font-weight: 800; color: #cbd5e1; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tire-condition { font-size: 12px; font-weight: 700; color: #f59e0b; text-transform: uppercase; margin-bottom: 6px; }
    .fitment-info { font-size: 12px; color: #94a3b8; font-weight: 500; background: #0f172a; padding: 5px 8px; border-radius: 5px; line-height: 1.2; }
    .fitment-info strong { color: #e2e8f0; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">Tire Bay <span>Command</span></div>
    <div class="header-right">
      <div id="syncStatusPill" class="sync-status sync-ok">
        <div class="sync-dot"></div>
        <span id="syncStatusText">Connecting to Google Sheet...</span>
      </div>
      <div class="clock" id="liveClock">--:-- --</div>
    </div>
  </header>

  <div class="dashboard-grid">
    <!-- Combined Bay Schedule (Left 40%) -->
    <div class="panel">
      <div class="panel-header">
        <h2>Service Queue & Pre-Pulls</h2>
        <span class="badge" id="queueCount">0 Jobs</span>
      </div>
      <div class="table-container" id="queueScrollBox">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Vehicle / Cust</th>
              <th>Service</th>
              <th>Storage</th>
              <th>Tech Notes</th>
            </tr>
          </thead>
          <tbody id="queueBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Hot In-Stock Inventory & Packages (Right 60%) -->
    <div class="panel">
      <div class="panel-header">
        <h2>In-Stock Deals (Tires, Wheels & Sets)</h2>
        <span class="badge" id="stockCount">0 Available</span>
      </div>
      <div class="inventory-container" id="stockScrollBox">
        <div class="inventory-grid" id="inventoryBody"></div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '19PY--63-6NK9hURQepUrEyVUxVkHy-bcdspogmycI6I';

    function updateClock() {
      const now = new Date();
      const el = document.getElementById('liveClock');
      if (el) el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setStatus(isOk, message) {
      const pill = document.getElementById('syncStatusPill');
      const text = document.getElementById('syncStatusText');
      if (!pill || !text) return;
      pill.className = isOk ? 'sync-status sync-ok' : 'sync-status sync-error';
      text.textContent = message;
    }

    function formatImageUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return null;
      const clean = rawUrl.trim();
      if (!clean.startsWith('http')) return null;

      if (clean.includes('drive.google.com')) {
        const fileIdMatch = clean.match(/\/d\/([a-zA-Z0-9_-]+)/) || clean.match(/id=([a-zA-Z0-9_-]+)/);
        if (fileIdMatch && fileIdMatch[1]) {
          return 'https://drive.google.com/thumbnail?id=' + fileIdMatch[1] + '&sz=w600';
        }
      }
      return clean;
    }

    function fetchSheetJSONP(tabName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gviz_cb_' + Math.random().toString(36).substring(2, 9);
        const script = document.createElement('script');

        window[callbackName] = function(json) {
          delete window[callbackName];
          if (document.body.contains(script)) document.body.removeChild(script);

          if (!json || json.status === 'error') {
            reject('Tab ' + tabName + ': ' + (json && json.errors && json.errors[0] ? json.errors[0].message : 'Fetch error'));
            return;
          }
          if (!json.table || !json.table.rows) {
            reject('Tab ' + tabName + ' empty');
            return;
          }

          const rows = json.table.rows.map(row => {
            if (!row || !row.c) return [];
            return row.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? (cell.f || cell.v.toString()) : '');
          });
          resolve(rows);
        };

        script.onerror = function() {
          delete window[callbackName];
          if (document.body.contains(script)) document.body.removeChild(script);
          reject('Network error loading ' + tabName);
        };

        script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?sheet=' + encodeURIComponent(tabName) + '&tqx=responseHandler:' + callbackName;
        document.body.appendChild(script);
      });
    }

    function renderQueue(rows) {
      const tbody = document.getElementById('queueBody');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      const filtered = rows.filter(r => r.length > 0 && r.some(c => c && c.trim() !== ''));
      if (filtered.length === 0) {
        document.getElementById('queueCount').textContent = '0 Jobs';
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">No appointments queued</td></tr>';
        return;
      }

      // Check whether Column A is Day (e.g., "Today", "Tomorrow")
      // If 7 columns exist, Col 0 = Day, Col 1 = Time, Col 2 = Cust, Col 3 = Veh, Col 4 = Service, Col 5 = Rack, Col 6 = Notes
      // If 6 columns exist, backwards compatible: Col 0 = Time, etc.
      const hasDayCol = filtered.some(r => {
        const val = (r[0] || '').toLowerCase().trim();
        return val.includes('today') || val.includes('tomorrow') || val.includes('mon') || val.includes('tue') || val.includes('wed') || val.includes('thu') || val.includes('fri') || val.includes('sat');
      });

      let todayList = [];
      let tomorrowList = [];

      if (hasDayCol) {
        filtered.forEach(r => {
          const dayVal = (r[0] || '').toLowerCase();
          if (dayVal.includes('tomorrow')) tomorrowList.push(r);
          else todayList.push(r);
        });
      } else {
        todayList = filtered;
      }

      document.getElementById('queueCount').textContent = `${todayList.length} Today • ${tomorrowList.length} Tmrw`;

      function appendJobRows(list, isTomorrow = false) {
        list.forEach(r => {
          const time    = (hasDayCol ? r[1] : r[0]) || '--';
          const cust    = (hasDayCol ? r[2] : r[1]) || '';
          const veh     = (hasDayCol ? r[3] : r[2]) || 'Walk-In';
          const service = (hasDayCol ? r[4] : r[3]) || 'General';
          const loc     = (hasDayCol ? r[5] : r[4]) || '';
          const notes   = (hasDayCol ? r[6] : r[5]) || '-';

          if (time === '--' && !cust && veh === 'Walk-In') return;

          const tr = document.createElement('tr');
          let locBadge = '<span class="storage-none">Not Stored</span>';
          if (loc && loc.trim() !== '' && loc.toLowerCase() !== 'none' && loc !== '?') {
            locBadge = isTomorrow 
              ? `<span class="storage-prepull">PULL: ${loc}</span>` 
              : `<span class="storage-tag">${loc}</span>`;
          }

          tr.innerHTML = `
            <td class="time-col">${time}</td>
            <td class="vehicle-col">${veh}<small>${cust}</small></td>
            <td><span class="service-badge">${service}</span></td>
            <td>${locBadge}</td>
            <td class="notes-text">${notes}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      // 1. Render Today Section
      if (todayList.length > 0) {
        const headerTr = document.createElement('tr');
        headerTr.className = 'day-divider-row';
        headerTr.innerHTML = `<td colspan="5" class="day-today">⚡ TODAY'S APPOINTMENTS (${todayList.length})</td>`;
        tbody.appendChild(headerTr);
        appendJobRows(todayList, false);
      }

      // 2. Render Tomorrow Section
      if (tomorrowList.length > 0) {
        const headerTr = document.createElement('tr');
        headerTr.className = 'day-divider-row';
        headerTr.innerHTML = `<td colspan="5" class="day-tomorrow">📦 TOMORROW'S QUEUE & PRE-PULLS (${tomorrowList.length})</td>`;
        tbody.appendChild(headerTr);
        appendJobRows(tomorrowList, true);
      }
    }

    function renderInventory(rows) {
      const container = document.getElementById('inventoryBody');
      if (!container) return;
      container.innerHTML = '';

      const filtered = rows.filter(r => r[0] && r[0].trim() !== '');
      document.getElementById('stockCount').textContent = filtered.length + ' Available';

      if (filtered.length === 0) {
        container.innerHTML = '<div style="color:#64748b; padding:20px; grid-column:span 2;">No items listed in SetsForSale</div>';
        return;
      }

      filtered.forEach(r => {
        const size = r[0] || '';
        const brand = r[1] || '';
        const cond = r[2] || 'Inspected';
        const fits = r[3] || '';
        const price = r[4] || 'Quote';
        const notes = r[5] || '';
        const rawPhoto = r[6] || '';
        const photoUrl = formatImageUrl(rawPhoto);

        const card = document.createElement('div');
        card.className = 'inventory-card';

        const photoHtml = photoUrl ? '<div class="card-photo"><img src="' + photoUrl + '" alt="' + brand + '" onerror="this.parentElement.style.display=\'none\'"></div>' : '';

        card.innerHTML = photoHtml +
          '<div class="card-content">' +
            '<div class="card-top">' +
              '<div class="tire-size">' + size + '</div>' +
              '<div class="price-tag">' + price + '</div>' +
            '</div>' +
            '<div class="tire-model">' + brand + '</div>' +
            '<div class="tire-condition">' + cond + '</div>' +
            '<div class="fitment-info"><strong>Fits:</strong> ' + fits + (notes ? ' • ' + notes : '') + '</div>' +
          '</div>';
        container.appendChild(card);
      });
    }

    function setupAutoScroller(elementId, speed = 1) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let direction = 1;
      let pauseUntil = 0;

      function step() {
        const now = Date.now();
        if (now > pauseUntil) {
          const maxScroll = el.scrollHeight - el.clientHeight;
          if (maxScroll > 15) {
            el.scrollTop += speed * direction;
            if (el.scrollTop >= maxScroll) {
              direction = -1;
              pauseUntil = now + 4000;
            } else if (el.scrollTop <= 0) {
              direction = 1;
              pauseUntil = now + 4000;
            }
          }
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    async function refreshDashboard() {
      try {
        const [queueRows, stockRows] = await Promise.all([
          fetchSheetJSONP('BayQueue'),
          fetchSheetJSONP('SetsForSale')
        ]);

        renderQueue(queueRows);
        renderInventory(stockRows);

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        setStatus(true, 'Synced (' + queueRows.length + ' Jobs, ' + stockRows.length + ' Items) @ ' + timeStr);
      } catch (err) {
        console.error(err);
        setStatus(false, err.toString());
      }
    }

    refreshDashboard();
    setInterval(refreshDashboard, 30000);

    setupAutoScroller('queueScrollBox', 0.5);
    setupAutoScroller('stockScrollBox', 0.6);
  </script>
</body>
</html>
