<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bay Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    
    /* Top offset to clear Porteus banner */
    body { 
      background-color: #0b0f19; 
      color: #f1f5f9; 
      padding: 55px 20px 16px 20px; 
      overflow: hidden; 
      height: 100vh; 
    }
    
    /* Top Header */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid #1e293b; margin-bottom: 14px; }
    .brand-title { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #f8fafc; }
    .brand-title span { color: #f59e0b; }
    .header-right { display: flex; align-items: center; gap: 24px; }
    
    .sync-status { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; }
    .sync-ok { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .sync-error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; }
    .sync-ok .sync-dot { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
    .sync-error .sync-dot { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }

    .clock { font-size: 30px; font-weight: 800; color: #ffffff; letter-spacing: 1px; }

    /* Main Grid: Left 40% (Queue), Right 60% (Inventory) */
    .dashboard-grid { display: grid; grid-template-columns: 40% 60%; gap: 18px; height: calc(100vh - 130px); }
    .panel { background: #131b2e; border: 1px solid #1e293b; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; overflow: hidden; height: 100%; min-height: 0; }
    .panel-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #243049; }
    .panel-header h2 { font-size: 19px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; color: #94a3b8; }
    .panel-header .badge { background: #1e293b; color: #f59e0b; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }

    /* Staging Queue Table & Scroller Container */
    .table-container { 
      flex: 1 1 0; 
      min-height: 0; 
      overflow-y: hidden; 
      position: relative; 
      display: block; 
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { position: sticky; top: 0; background: #131b2e; color: #64748b; font-size: 11px; text-transform: uppercase; padding: 8px 6px; border-bottom: 2px solid #243049; z-index: 10; }
