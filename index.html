<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bay Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 20px; overflow: hidden; height: 100vh; }
    
    /* Top Header */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 2px solid #1e293b; margin-bottom: 18px; }
    .brand-title { font-size: 26px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #f8fafc; }
    .brand-title span { color: #f59e0b; }
    .header-right { display: flex; align-items: center; gap: 24px; }
    .sync-status { font-size: 14px; font-weight: 600; color: #10b981; display: flex; align-items: center; gap: 8px; }
    .sync-dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }
    .clock { font-size: 32px; font-weight: 800; color: #ffffff; letter-spacing: 1px; }

    /* Main Grid */
    .dashboard-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; height: calc(100vh - 100px); }
    .panel { background: #131b2e; border: 1px solid #1e293b; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #243049; }
    .panel-header h2 { font-size: 20px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; color: #94a3b8; }
    .panel-header .badge { background: #1e293b; color: #f59e0b; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }

    /* Staging Queue Table */
    .table-container { overflow-y: auto; flex-grow: 1; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { position: sticky; top: 0; background: #131b2e; color: #64748b; font-size: 13px; text-transform: uppercase; padding: 10px 8px; border-bottom: 2px solid #243049; }
    td { padding: 12px 8px; border-bottom: 1px solid #1e293b; font-size: 15px; vertical-align: middle; }
    tr:nth-child(even) td { background-color: rgba(255, 255, 255, 0.015); }

    .time-col { font-weight: 800; color: #cbd5e1; font-size: 16px; white-space: nowrap; }
    .vehicle-col { font-weight: 700; color: #ffffff; font-size: 16px; }
    .vehicle-col small { display: block; color: #94a3b8; font-size: 13px; font-weight: 500; }
    .service-badge { display: inline-block; background: #1e3a5f; color: #38bdf8; font-weight: 700; font-size: 13px; padding: 4px 8px; border-radius: 4px; }
    .storage-tag { display: inline-block; background: #b45309; color: #fffbeb; font-weight: 900; font-size: 15px; padding: 5px 10px; border-radius: 6px; letter-spacing: 0.5px; border: 1px solid #f59e0b; }
    .storage-none { color: #475569; font-weight: 600; font-size: 13px; }
    .notes-text { color: #f59e0b; font-weight: 600; font-size: 13px; max-width: 220px; }

    /* Inventory Cards */
    .inventory-container { overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }
    .inventory-card { background: #182238; border: 1px solid #263554; border-radius: 8px; padding: 14px; position: relative; border-left: 5px solid #10b981; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .tire-size { font-size: 24px; font-weight: 900; color: #ffffff; letter-spacing: 0.5px; }
    .price-tag { font-size: 20px; font-weight: 900; color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.3); }
    .tire-model { font-size: 16px; font-weight: 700; color: #cbd5e1; margin-bottom: 4px; }
    .tire-condition { font-size: 13px; font-weight: 700; color: #f59e0b; text-transform: uppercase; margin-bottom: 8px; }
    .fitment-info { font-size: 13px; color: #94a3b8; font-weight: 500; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
    .fitment-info strong { color: #cbd5e1; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">Tire Bay <span>Command</span></div>
    <div class="header-right">
      <div class="sync-status"><div class="sync-dot"></div> Live Sheets Connected</div>
      <div class="clock" id="liveClock">--:-- --</div>
    </div>
  </header>

  <div class="dashboard-grid">
    <!-- Bay Schedule & Pre-Pull -->
    <div class="panel">
      <div class="panel-header">
        <h2>Today's Bay Staging & Service Queue</h2>
        <span class="badge" id="queueCount">0 Jobs</span>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Customer & Vehicle</th>
              <th>Service</th>
              <th>Storage Bin</th>
              <th>Technician Notes</th>
            </tr>
          </thead>
          <tbody id="queueBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Ready To Mount Stock -->
    <div class="panel">
      <div class="panel-header">
        <h2>Hot In-Stock Sets (Ready To Sell)</h2>
        <span class="badge" id="stockCount">0 Sets Available</span>
      </div>
      <div class="inventory-container" id="inventoryBody"></div>
    </div>
  </div>

  <script>
    // 1. REPLACE WITH YOUR GOOGLE SHEET ID
    const SHEET_ID = 'YOUR_GOOGLE_SHEET_ID_HERE';
    
    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Robust CSV parser
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      return lines.map(line => {
        const row = [];
        let inQuotes = false;
        let cell = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) { row.push(cell.trim().replace(/^"|"$/g, '')); cell = ''; }
          else cell += char;
        }
        row.push(cell.trim().replace(/^"|"$/g, ''));
        return row;
      });
    }

    // Fallback Mock Data (displays if Sheet ID is not yet connected)
    const mockQueue = [
      ["8:30 AM", "Kishan L.", "2021 Toyota RAV4", "Winter Swap", "Rack H3", "Lug nut lock key in armrest"],
      ["9:15 AM", "Sarah Jenkins", "2019 Honda Civic", "Mount & Balance", "None", "Cust supplied rims"],
      ["10:00 AM", "Mike Torres", "2020 Ram 1500", "Winter Swap", "Rack B12", "Torque to 130 lb-ft, check RF bead"],
      ["10:45 AM", "Aaron Patel", "2022 Hyundai Tucson", "Flat Repair", "None", "Nail in RR tread block"]
    ];

    const mockInventory = [
      ["225/65R17", "Michelin X-Ice Snow", "Brand New (11/32\")", "RAV4, CR-V, CX-5, Rogue", "$840 Mounted", "Ready to bolt on"],
      ["275/55R20", "Bridgestone Blizzak DM-V2", "Used - 9/32\" (85%)", "F-150, Ram 1500, Tahoe, Yukon", "$750 Installed", "No camber wear, mint"],
      ["205/55R16", "Continental VikingContact 7", "Brand New (10/32\")", "Civic, Corolla, Golf, Elantra", "$680 Mounted", "Set of 4 on shelf"]
    ];

    async function fetchSheetData(tabName) {
      if (SHEET_ID === 'YOUR_GOOGLE_SHEET_ID_HERE') return null;
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const text = await res.text();
        const data = parseCSV(text);
        return data.slice(1); // skip headers
      } catch (err) {
        console.error('Fetch error:', err);
        return null;
      }
    }

    function renderQueue(rows) {
      const tbody = document.getElementById('queueBody');
      tbody.innerHTML = '';
      document.getElementById('queueCount').textContent = `${rows.length} Active`;
      
      rows.forEach(r => {
        const [time, cust, veh, service, loc, notes] = r;
        if (!time && !cust) return;
        const tr = document.createElement('tr');
        const locBadge = (loc && loc.trim() !== '' && loc.toLowerCase() !== 'none') 
          ? `<span class="storage-tag">${loc}</span>` 
          : `<span class="storage-none">Not Stored</span>`;

        tr.innerHTML = `
          <td class="time-col">${time || '--'}</td>
          <td class="vehicle-col">${veh || 'Walk-In'}<small>${cust || ''}</small></td>
          <td><span class="service-badge">${service || 'General'}</span></td>
          <td>${locBadge}</td>
          <td class="notes-text">${notes || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderInventory(rows) {
      const container = document.getElementById('inventoryBody');
      container.innerHTML = '';
      document.getElementById('stockCount').textContent = `${rows.length} Sets Ready`;

      rows.forEach(r => {
        const [size, brand, cond, fits, price, notes] = r;
        if (!size) return;
        const card = document.createElement('div');
        card.className = 'inventory-card';
        card.innerHTML = `
          <div class="card-top">
            <div class="tire-size">${size}</div>
            <div class="price-tag">${price || 'Quote'}</div>
          </div>
          <div class="tire-model">${brand || ''}</div>
          <div class="tire-condition">${cond || 'Inspected'}</div>
          <div class="fitment-info"><strong>Fits:</strong> ${fits || 'Universal'} ${notes ? '• ' + notes : ''}</div>
        `;
        container.appendChild(card);
      });
    }

    async function refreshDashboard() {
      const queueData = await fetchSheetData('BayQueue');
      const stockData = await fetchSheetData('SetsForSale');

      renderQueue(queueData || mockQueue);
      renderInventory(stockData || mockInventory);
    }

    // Initial load + refresh every 30 seconds
    refreshDashboard();
    setInterval(refreshDashboard, 30000);
  </script>
</body>
</html>
